version: '3.8'

services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "8080:80"        # Web arayüzü
      - "5353:53/udp"    # DNS çözümleme (alternatif port)
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Istanbul
      #- SERVERURL=yourdomain.com  # DDNS varsa kullan, yoksa IP yaz
      - SERVERPORT=51820
      - PEERS=2  # Kaç cihaz bağlanacak
      - PEERDNS=172.20.0.2  # AdGuard'ın container içi IP'si (aşağıda ağa göre ayarlanıyor)
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      adguard_vpn_net:
        ipv4_address: 172.20.0.3

networks:
  adguard_vpn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24